<mj-raw>
  <div class="info-box" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-left: 4px solid #0B4627; border-radius: 6px; padding: 14px 18px; margin: 16px 0;">
    <p style="margin: 0 0 6px 0; font-size: 12px; font-weight: 700; color: #0F2B1C; text-transform: uppercase; letter-spacing: 0.5px;">
      {{#if title}}{{title}}{{else}}Security Notice{{/if}}
    </p>
    <p style="margin: 0; font-size: 13px; color: #4A5568; line-height: 1.55;">
      {{message}}
    </p>
  </div>
</mj-raw>
