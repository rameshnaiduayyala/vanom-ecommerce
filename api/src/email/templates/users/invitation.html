<mj-text font-size="22px" font-weight="bold" color="#0F2B1C" padding="0 0 16px 0">
  You are Invited!
</mj-text>

<mj-text padding="0 0 12px 0">
  Hi {{name}},
</mj-text>

<mj-text padding="0 0 16px 0">
  You have been invited to join <strong>{{organizationName}}</strong> on Vanom as a <strong>{{role}}</strong>.
</mj-text>

<mj-button background-color="#0B4627" color="#ffffff" font-size="14px" font-weight="bold" border-radius="6px" href="{{inviteUrl}}" align="left" padding="12px 0 20px 0">
  Accept Invitation
</mj-button>

<mj-text font-size="13px" color="#718096" padding="0">
  This invitation was sent by {{inviterName}}. If you were not expecting this, you can ignore this message.
</mj-text>
