<mjml>
  <mj-head>
    <mj-title>{{title}}</mj-title>
    {{#if preview}}
      <mj-preview>{{preview}}</mj-preview>
    {{/if}}
    <mj-attributes>
      <mj-all font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" />
      <mj-text font-size="15px" color="#2D3748" line-height="1.6" />
      <mj-section background-color="#ffffff" />
    </mj-attributes>
    <mj-style>
      .info-box {
        background-color: #F8FAFC;
        border: 1px solid #E2E8F0;
        border-radius: 6px;
        padding: 16px 20px;
        margin: 16px 0;
      }
      .link-text {
        color: #0B4627;
        text-decoration: underline;
      }
    </mj-style>
  </mj-head>
  <mj-body background-color="#F4F6F8">
    <!-- Header Section -->
    <mj-section padding="24px 32px 16px" border-bottom="1px solid #F0F0F0">
      <mj-column width="60%" vertical-align="middle">
        <mj-image align="left" width="140px" src="{{logoUrl}}" alt="Vanom" padding="0" />
      </mj-column>
      <mj-column width="40%" vertical-align="middle">
        <mj-text align="right" font-size="12px" color="#A0AEC0" font-weight="600" text-transform="uppercase" letter-spacing="1px" padding="0">
          Vanom Official
        </mj-text>
      </mj-column>
    </mj-section>

    <!-- Main Content Slot -->
    <mj-section padding="32px 32px 24px">
      <mj-column width="100%">
        {{{bodyContent}}}
      </mj-column>
    </mj-section>

    <!-- Shared Footer Partial -->
    {{> commonFooter}}
  </mj-body>
</mjml>
